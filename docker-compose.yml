services:
  db:
    image: postgres:16-alpine
    container_name: lms-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    ports:
      - "5433:5432"   # host 5433 -> avoids clashing with any local Postgres on 5432
    volumes:
      - lms_pgdata:/var/lib/postgresql/data   # named volume: data survives restarts
      - ./db/init:/docker-entrypoint-initdb.d  # creates the test database on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms}"]
      interval: 5s
      retries: 10

volumes:
  lms_pgdata:
