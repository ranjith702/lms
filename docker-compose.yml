services:
  db:
    image: postgres:16-alpine
    container_name: lms-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      # No fallback: compose refuses to start unless .env sets a password (LMS-BUG-007).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    ports:
      # 127.0.0.1 = reachable only from this laptop, not the Wi-Fi network.
      # Host port 5433 avoids clashing with any other local Postgres on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - lms_pgdata:/var/lib/postgresql/data   # named volume: data survives restarts
      - ./db/init:/docker-entrypoint-initdb.d  # creates the test database on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms}"]
      interval: 5s
      retries: 10

volumes:
  lms_pgdata:
